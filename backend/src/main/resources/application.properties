spring.application.name=nexus-access
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USERNAME}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET:development-only-secret-change-me-development-only-secret}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
