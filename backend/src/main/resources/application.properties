spring.application.name=nexus-access
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:nexus_access}
spring.datasource.username=${DB_USERNAME:nexus_access}
spring.datasource.password=${DB_PASSWORD:change-me-in-local-env}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.validate-on-migrate=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
jwt.secret=${JWT_SECRET:development-only-secret-change-me-development-only-secret}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
